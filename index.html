<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrick's Software Hub | 作品集</title>
    <base href="/homepage/">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            scroll-behavior: smooth;
        }
        .project-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body class="text-slate-900">

    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
            <span class="text-xl font-bold tracking-tight text-blue-600">Patrick.Dev</span>
            <div class="hidden md:flex space-x-8 text-sm font-medium text-slate-600">
                <a href="#" class="hover:text-blue-600 transition">首页</a>
                <a href="#projects" class="hover:text-blue-600 transition">软件项目</a>
                <a href="mailto:patrick1130@example.com" class="hover:text-blue-600 transition">联系我</a>
            </div>
        </div>
    </nav>

    <header class="py-16 md:py-24 px-6">
        <div class="max-w-5xl mx-auto text-center">
            <h1 class="text-4xl md:text-6xl font-extrabold text-slate-900 mb-6 tracking-tight">
                我的软件实验室
            </h1>
            <p class="text-lg md:text-xl text-slate-600 max-w-2xl mx-auto leading-relaxed">
                探索我开发的各种工具与应用。从自动化引擎到行业解决方案，每一个项目都是对技术的实践与思考。
            </p>
        </div>
    </header>

    <main id="projects" class="max-w-5xl mx-auto px-6 pb-24">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            
            <div class="project-card bg-white rounded-2xl border border-slate-200 overflow-hidden flex flex-col">
                <div class="p-6 flex-grow">
                    <div class="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center text-blue-600 mb-4">
                        <i class="fa-solid fa-server text-xl"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-2 text-slate-800">Nexus Prime</h3>
                    <p class="text-slate-500 text-sm leading-relaxed mb-4">
                        高效的自动化处理引擎，支持多任务并行调度与实时监控。
                    </p>
                    <div class="flex flex-wrap gap-2 mb-4">
                        <span class="px-2 py-1 bg-blue-50 text-blue-700 text-[10px] font-bold uppercase rounded-md">Automation</span>
                        <span class="px-2 py-1 bg-slate-100 text-slate-600 text-[10px] font-bold uppercase rounded-md">Node.js</span>
                    </div>
                </div>
                <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex justify-between items-center">
                    <a href="https://nexus.yourdomain.com" target="_blank" class="text-blue-600 font-bold text-sm hover:text-blue-700 inline-flex items-center">
                        立即访问 <i class="fa-solid fa-chevron-right ml-1 text-[10px]"></i>
                    </a>
                    <span class="text-slate-400 text-[10px] font-medium uppercase tracking-wider">v1.0.0</span>
                </div>
            </div>

            <div class="project-card bg-white rounded-2xl border border-slate-200 overflow-hidden flex flex-col">
                <div class="p-6 flex-grow flex flex-col items-center justify-center text-center py-12">
                    <div class="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center text-slate-400 mb-3">
                        <i class="fa-solid fa-plus"></i>
                    </div>
                    <p class="text-slate-400 font-medium">更多软件正在部署中...</p>
                </div>
            </div>

        </div>
    </main>

    <footer class="border-t border-slate-200 py-12 bg-white">
        <div class="max-w-5xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-6">
            <p class="text-slate-500 text-sm">© 2026 Patrick. 使用 Tailwind CSS 构建</p>
            <div class="flex space-x-6">
                <a href="https://github.com/patrick1130" target="_blank" class="text-slate-400 hover:text-slate-900 transition">
                    <i class="fa-brands fa-github text-xl"></i>
                </a>
                <a href="#" class="text-slate-400 hover:text-blue-400 transition">
                    <i class="fa-brands fa-weixin text-xl"></i>
                </a>
            </div>
        </div>
    </footer>

</body>
</html>
